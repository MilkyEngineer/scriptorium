[project]
name = "scriptorium"
version = "0.1.0.dev0"
description = "Self-hosted MCP server and sync worker for reMarkable libraries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyJWT[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "cryptography>=43",
    "uvicorn>=0.30,<1",
    "starlette>=0.40,<1",
    "remarkable-mcp[render] @ git+https://github.com/MilkyEngineer/remarkable-mcp@scriptorium-s3",
]

[project.scripts]
scriptorium = "scriptorium.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-licenses>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the pinned fork of remarkable-mcp (§4.3)

[tool.hatch.build.targets.wheel]
packages = ["src/scriptorium"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]  # agent worktrees live under .claude/worktrees

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "N", "ASYNC", "RUF"]
ignore = ["S101"]  # asserts are fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/scriptorium"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["remarkable_mcp.*", "rmscene.*", "resvg_py.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:scriptorium.*"]
